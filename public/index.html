<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Game</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/input.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="icon" href="assets//favicon.ico">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

</head>
<body>

    <div id ="selectionScreen">
        <h1 style="text-align: center; color:white"><strong>MagicPoly</strong></h1>
        <br>

 

        <div id="name" style="justify-content: center;">
            <input id="usernameInput" type="text" placeholder="Votre pseudo" />
            <br>
            <br>
            <button id="createRoom">Create a Room</button>
        </div>
        <br>
        <h2 style="text-align: center">Room List:</h2>
        <br>
        <span id="error"></span>
        <ul id="roomList">

        </ul>
    </div>

    <div id ="roomScreen" style = "display: none;">
        <h3>Players List:</h3>
        <ul id="playerList">

        </ul>
        <p>Attendez que l'Hôte lance la partie.</p>
        <button id="start" style="display: none;">Start</button>
        <div>
            <input type="checkbox" id="checkbox" name="checkbox" style="display:none;"checked />
            <label for="ai">Ajouter IA</label>
        </div>
        <div >
            <img src="assets/classic.png"   id="classic"/>
            
        </div>
    </div>

    <div id="gameScreen" style = "display: none;">

        <div style="position:relative; width:600px; height:600px;  ">
            <div id="emote-display-container" style="padding-top: 100px;"></div>
            <!-- Plateau -->
            <canvas id="board" width="1200" height="1200"
                    style="position:absolute; left:0; top:0; width:600px; height:600px; z-index:1;"></canvas>
            <!-- Pions -->
            <canvas id="tokens" width="1200" height="1200"
                    style="position:absolute; left:0; top:0; width:600px; height:600px; z-index:2;"></canvas>
            
            <canvas id="diceCanvas" width="800" height="800"></canvas>

            <div id="emoteCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>

            
        </div>

    <!-- Contrôles en dehors du conteneur -->
        <!--<div id="controls"> -->
        <div class="emote-menu">
            <button onclick="sendEmote('😀')">😀</button>
            <button onclick="sendEmote('🤔')">🤔</button>
            
        </div>
            <button id="startMusic">♫</button>
            <button id="action" style="display: none;">Lancer les dés</button>
                <br>
                <br>
            <button id="popUp" style="display: none;">Acheter?</button>
            <button id="endTurn" style="display: none;">Finir le tour</button>
            <button id="free" style="display: none;">Payer 50€ pour sortir ?</button>

                <div id="log" style="border: 2px solid black;"></div>
                    <ul id="lb"></ul>
        <!--</div> -->
        <!-- Popup structure -->
        <div id="popupOverlay" class="popup-overlay">
            <div class="popup-content">
                <span class="close-btn" id="closePopupBtn">&times;</span>
                <h2>Chance/Caisse de communauté</h2>
                <p id="chanceText"></p>
            </div>
        </div>
        <button id="quit" style="display:none"> Quitter ⇨</button>
    </div>

    

    <script>

        document.getElementById("popupOverlay").addEventListener("click", () =>{
            document.getElementById("popupOverlay").style.display = "none";
        })
            function isMobileDevice() {
                // Test common mobile device keywords in the user agent
                return /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i
                    .test(navigator.userAgent);
            }

            if ( !(isMobileDevice()) ){
                console.log("coucou")
            }
            else{
                document.getElementById('name').style.paddingLeft = "200px";
            }
            
    </script>
    <script src="functions.js"></script>
    <script src="client.js"></script>

</body>
</html>
